<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2840">
<title>모두의 쉼터 · 3D 미리보기</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3a3550; --card: rgba(255, 250, 244, 0.96); --accent: #ff8a5c; --on: #ffe4d6; --on-ink: #c2453c; --chip: #f1edf8; --line: #3a3550; --shadow: 0 5px 0 rgba(40, 30, 60, 0.25); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2840; color: var(--ink); font-family: "Jua", "Apple SD Gothic Neo", sans-serif; }
  body { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: inherit; color: inherit; border: 0; cursor: pointer; }
  .hidden { display: none !important; }
  .bar { position: absolute; display: flex; gap: 4px; background: var(--card); padding: 5px; border-radius: 16px; box-shadow: var(--shadow); border: 2px solid var(--line); }
  .bar button { background: transparent; border-radius: 11px; padding: 8px 10px; font-size: 14px; white-space: nowrap; }
  .bar button.on { background: var(--on); color: var(--on-ink); }
  #top { left: 12px; top: calc(env(safe-area-inset-top) + 12px); }
  #mapBtn { position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 12px); height: 46px; padding: 0 14px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); box-shadow: var(--shadow); font-size: 16px; }
  #px { left: 12px; bottom: calc(env(safe-area-inset-bottom) + 14px); }
  #cam { right: 12px; top: calc(env(safe-area-inset-top) + 66px); }
  #cam button { min-width: 34px; font-size: 17px; padding: 6px 7px; }
  #rotL, #rotR { font-family: system-ui, sans-serif; font-size: 21px; line-height: 1; } /* Jua 에는 화살표 글자가 없어 작게 나온다 */
  #top a { display: flex; align-items: center; border-radius: 11px; padding: 8px 10px; font-size: 14px; color: inherit; text-decoration: none; white-space: nowrap; }
  #badge { position: absolute; left: 12px; top: calc(env(safe-area-inset-top) + 72px); font-size: 12px; color: #fff; background: rgba(43, 40, 64, .7); padding: 4px 10px; border-radius: 10px; pointer-events: none; white-space: nowrap; }
  /* 불러오는 화면 · 실패 안내 */
  #boot { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: #2b2840; color: #fff; text-align: center; transition: opacity .4s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot b { display: block; font-size: 22px; margin-top: 10px; font-weight: normal; }
  #boot small { display: block; margin-top: 6px; opacity: .7; font-size: 14px; }
  #boot .snowman { font-size: 46px; animation: bob 1.2s ease-in-out infinite; }
  #boot a { display: inline-block; margin-top: 16px; color: #2b2840; background: #fff; padding: 8px 16px; border-radius: 12px; text-decoration: none; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  /* 조작 안내 */
  #help ul { margin: 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.5; }
  #help li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px dashed #ddd6e8; }
  #help li:first-child { border-top: 0; }
  #help li span:first-child { width: 26px; flex: none; text-align: center; }
  #help .note { font-size: 13px; opacity: .7; margin: 8px 0 10px; }
  #help .go { width: 100%; height: 46px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 17px; }
  /* 지도 편집 모드 (?edit, 개발 서버에서만): 놀이 버튼은 숨기고 왼쪽에 도구 막대 */
  body.edit #actions, body.edit #emotePal, body.edit #emoteBubble, body.edit #tag, body.edit #where, body.edit #dressBtn, body.edit #diceBtn, body.edit #helpBtn { display: none !important; }
  body.edit #badge { background: #c2453c; }
  #edit { left: 12px; top: calc(env(safe-area-inset-top) + 104px); flex-direction: column; width: 124px; }
  #edit button { text-align: left; padding: 7px 9px; }
  #edit button:disabled { opacity: .4; }
  #edit hr { width: 100%; border: 0; border-top: 1px dashed #ddd6e8; margin: 2px 0; }
  #edit .save { background: var(--accent); color: #fff; }
  #edit .save.clean { background: transparent; color: inherit; }
  #editInfo { position: absolute; left: 12px; bottom: calc(env(safe-area-inset-bottom) + 72px); max-width: calc(100% - 24px); font-size: 13px; color: #fff; background: rgba(43, 40, 64, .78); padding: 6px 10px; border-radius: 10px; pointer-events: none; white-space: pre-line; }
  #editResult ul { margin: 0 0 10px; padding-left: 18px; font-size: 14px; line-height: 1.5; max-height: 40vh; overflow-y: auto; }
  #editResult small { display: block; opacity: .6; margin-bottom: 10px; }
  #where { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 116px); font-size: 14px; color: #fff; background: rgba(43, 40, 64, .7); padding: 4px 12px; border-radius: 10px; pointer-events: none; white-space: nowrap; }
  #actions { position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .act { min-width: 104px; height: 54px; padding: 0 16px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); box-shadow: var(--shadow); font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .act.main { background: var(--accent); color: #fff; }
  .act:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(40, 30, 60, .25); }
  .ic { width: 30px; height: 30px; background-size: 300% 100%; background-position: 0 0; image-rendering: pixelated; flex: none; }
  #toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 100px); transform: translateX(-50%); background: var(--card); border: 2px solid var(--line); border-radius: 14px;
    padding: 8px 16px; font-size: 15px; box-shadow: var(--shadow); white-space: nowrap; transition: opacity .25s; pointer-events: none; text-align: center; max-width: calc(100% - 24px); }
  #toast.off { opacity: 0; }
  #toast .barp { height: 6px; background: #efe6f6; margin-top: 6px; border-radius: 3px; overflow: hidden; }
  #toast .barp i { display: block; height: 100%; width: 0; background: var(--accent); }
  .modal { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(30, 25, 50, .35); }
  .sheet { width: calc(100% - 24px); max-width: 440px; margin-bottom: calc(env(safe-area-inset-bottom) + 12px); background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); }
  .sheet header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 20px; }
  .sheet header button { width: 38px; height: 38px; border-radius: 12px; background: var(--chip); font-size: 17px; }
  .foods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .food { background: var(--chip); border-radius: 14px; padding: 10px 6px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .food .ic { width: 36px; height: 36px; }
  #dress .sheet { max-height: calc(100% - 90px); overflow-y: auto; }
  .dtop { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 6px; }
  #dressPrev { width: 128px; height: 128px; image-rendering: pixelated; background: #e9ecf7; border-radius: 16px; }
  .drow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px dashed #ddd6e8; }
  .drow > span { width: 52px; flex: none; font-size: 14px; opacity: .75; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 11px; padding: 7px 11px; font-size: 14px; }
  .chip.on { background: var(--on); color: var(--on-ink); box-shadow: inset 0 0 0 2px var(--on-ink); }
  .chip:disabled { opacity: .35; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(58, 53, 80, .25); }
  .sw.on { border: 3px solid var(--ink); transform: scale(1.1); }
  .sw.none { background: repeating-linear-gradient(45deg, #fff 0 4px, #e7e2ef 4px 8px); }
  #btnEmote { width: 54px; height: 54px; border-radius: 50%; background: var(--card) var(--emote-btn) center / 36px no-repeat; image-rendering: pixelated; border: 2px solid var(--line); box-shadow: var(--shadow); }
  #emotePal { position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 80px); display: grid; grid-template-columns: repeat(4, 64px); gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 8px; box-shadow: var(--shadow); }
  #emotePal button { background: var(--chip); border-radius: 12px; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
  #emotePal button:disabled { opacity: .4; }
  #emotePal i, #emoteBubble { display: block; width: 40px; height: 40px; background-image: var(--emotes); background-size: 800% 100%; image-rendering: pixelated; }
  #emoteBubble { position: absolute; width: 48px; height: 48px; transform: translate(-50%, -100%); pointer-events: none; transition: opacity .3s; }
  #emoteBubble.pop { animation: bub .14s ease-out; } #emoteBubble.out { opacity: 0; }
  @keyframes bub { from { transform: translate(-50%, -100%) scale(.3); } to { transform: translate(-50%, -100%) scale(1); } }
  .pop.bub { color: #1b2433; background: #fff; border: 2px solid var(--line); border-radius: 9px; padding: 0 6px; font-size: 13px; text-shadow: none; }
  .pop.ex { color: #ffc93a; font-size: 24px; text-shadow: 2px 0 #3a3550, -2px 0 #3a3550, 0 2px #3a3550, 0 -2px #3a3550; }
  .pop.q { color: #fff; font-size: 22px; text-shadow: 2px 0 #3a3550, -2px 0 #3a3550, 0 2px #3a3550, 0 -2px #3a3550; }
  .pop.purr { color: #e2587a; font-size: 15px; }
  .pop.heart { color: #ff6f93; font-size: 16px; animation-duration: 1.1s; }
  .pop.zz { color: #7f8fb8; font-size: 14px; animation-duration: 1.6s; }
  #mapModal { align-items: center; }
  #mapModal .sheet { margin: 0; max-width: 560px; padding: 10px; }
  #mapCanvas { display: block; width: 100%; height: auto; border-radius: 12px; image-rendering: pixelated; touch-action: none; }
  .hint { font-size: 13px; opacity: .7; margin-top: 6px; text-align: center; }
  .tag { position: absolute; transform: translate(-50%, -100%); font-size: 12px; color: #fff; background: rgba(43, 40, 64, .8); padding: 1px 7px; border-radius: 8px; pointer-events: none; white-space: nowrap; }
  .pop { position: absolute; transform: translate(-50%, -100%); font-size: 17px; color: #c2453c; pointer-events: none; white-space: nowrap; text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff; animation: pop 1.3s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -30px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="boot" role="status"><div><div class="snowman">⛄</div><b>겨울 공원 준비 중…</b><small>처음 열 때는 조금 걸려요</small></div></div>
<div class="bar" id="top"></div>
<div id="badge">미리보기 · 나 혼자</div>
<button id="mapBtn">🗺 지도</button>
<div class="bar" id="cam"><button id="rotL" aria-label="시점 왼쪽으로 돌리기" title="시점 돌리기 [">↺</button><button id="rotR" aria-label="시점 오른쪽으로 돌리기" title="시점 돌리기 ]">↻</button><button id="zoomOut" aria-label="축소" title="축소 -">－</button><button id="zoomIn" aria-label="확대" title="확대 +">＋</button></div>
<div id="where"></div>
<div class="bar" id="px"><button data-px="1">선명</button><button data-px="1.5">보통</button><button data-px="2">도트</button></div>
<div id="toast" class="off"></div>
<div id="tag" class="tag">나</div>
<div id="emotePal" class="hidden"></div>
<div id="emoteBubble" class="hidden"></div>
<div id="actions">
  <button class="act hidden" id="btnPet"><span>🐾</span><span>쓰다듬기</span></button>
  <button class="act hidden" id="btnSit"><span>🪑</span><span>앉기</span></button>
  <button class="act hidden" id="btnEat"><span class="ic"></span><span></span></button>
  <button class="act main hidden" id="btnShop"><span>🍢</span><span>주문</span></button>
  <button id="btnEmote" aria-label="이모티콘"></button>
</div>
<div id="dress" class="modal hidden"><div class="sheet"><header><span>꾸미기</span><button id="dressClose" aria-label="닫기">✕</button></header><div class="dtop"><canvas id="dressPrev" width="128" height="128"></canvas><button id="dressRand" class="chip">🎲 아무거나</button></div><div id="dressRows"></div></div></div>
<div id="menu" class="modal hidden"><div class="sheet"><header><span id="menuTitle"></span><button id="menuClose" aria-label="닫기">✕</button></header><div class="foods" id="foods"></div></div></div>
<div id="help" class="modal hidden"><div class="sheet"><header><span>3D 겨울 공원 미리보기</span><button id="helpClose" aria-label="닫기">✕</button></header>
<ul><li><span>👆</span><span>바닥을 누르면 걸어가요. 누른 채 끌면 그쪽으로 계속 걸어요</span></li>
<li><span>🍢</span><span>트럭·벤치·고양이를 누르면 다가가서 주문하고, 앉고, 쓰다듬어요</span></li>
<li><span>🔍</span><span>두 손가락 벌리기·오므리기(휠, ＋/－)로 확대·축소</span></li>
<li><span>↻</span><span>↺ ↻ 버튼으로 공원을 돌려 볼 수 있어요</span></li>
<li><span>👕</span><span>꾸미기에서 머리·옷·모자를 골라요</span></li></ul>
<p class="note">미리보기라 다른 사람은 보이지 않고, 꾸민 모습은 이 기기에만 저장돼요.</p>
<button class="go" id="helpGo">둘러보기</button></div></div>
<div id="mapModal" class="modal hidden"><div class="sheet"><header><span>공원 지도</span><button id="mapClose" aria-label="닫기">✕</button></header><canvas id="mapCanvas"></canvas><div class="hint">가게나 가고 싶은 곳을 누르면 걸어가요</div></div></div>

<script>
// 불러오는 동안 생긴 오류(파일을 못 받음·WebGL 을 못 씀)는 빈 화면 대신 안내로
window.bootFail = (msg) => { const b = document.getElementById("boot"); if (!b || b.classList.contains("done")) return;
  b.innerHTML = `<div><div class="snowman">🥶</div><b>${msg}</b><small>새로고침하거나 다른 브라우저로 열어 주세요</small>${location.protocol === "file:" ? "" : '<a href="/">쉼터로 돌아가기</a>'}</div>`; };
// 지도 편집 모드(?edit): 개발 서버(pnpm dev)의 저장 통로가 응답할 때만 켠다. 운영에는 통로가 없어서 그냥 미리보기로 열린다
window.MAPEDIT_MAP = null;
if (/[?&]edit\b/.test(location.search)) try { const x = new XMLHttpRequest(); x.open("GET", "/__mapedit/map", false); x.send(); if (x.status === 200) window.MAPEDIT_MAP = JSON.parse(x.responseText); } catch {}
window.addEventListener("error", (e) => window.bootFail(/WebGL/i.test(e.message || "") ? "이 기기에서는 3D 화면을 열 수 없어요" : "공원을 불러오지 못했어요"));
</script>
<script src="three.min.js"></script>
<script src="sprites-data.js"></script>
<script>
(() => {
"use strict";
// 모두의 쉼터 지도(assets/maps/park.json)를 3D 도트 디오라마로 세운다.
// 배경 = 저해상도 3D(툰 음영·깊이 외곽선), 사람·고양이 = 기존 도트 시트를 화면 해상도로. 1칸(32px) = 1.
const $ = (id) => document.getElementById(id);
if (!window.THREE || !window.PARK || !window.SPRITES) return window.bootFail("공원을 불러오지 못했어요");
const PARK = window.PARK, SPR = window.SPRITES;
if (window.MAPEDIT_MAP) PARK.map = window.MAPEDIT_MAP; // 편집 모드: 저장된 디스크 지도로 (내장본은 지난 저장 때 것)
const EDIT = { on: !!window.MAPEDIT_MAP }; // 지도 편집 모드 상태·함수 (맨 아래 "지도 편집 모드"에서 채운다)
const MAP = PARK.map, MW = MAP.width, MH = MAP.height;
const layer = (n) => MAP.layers.find((l) => l.name === n);
const GROUND = layer("ground").data, OBST = layer("obstacles").data;
const G = { snow: 1, snow2: 2, path: 3, plaza: 4, ice: 5, outside: 6, tree: 7, fence: 8, rock: 9, wall: 10, benchDown: 11, benchUp: 12, benchLeft: 13, garden: 14, bridge: 15, stage: 16 };
const prop = (o, k) => (o.properties || []).find((p) => p.name === k)?.value;
const blocked = (x, y) => x < 0 || y < 0 || x >= MW || y >= MH || OBST[y * MW + x] !== 0;
const groundAt = (x, y) => GROUND[y * MW + x];
const MENU = new Map(PARK.menu.map((m) => [m.id, m]));
const TRUCK_DEF = new Map(PARK.trucks.map((t) => [t.id, t]));

const canvas = $("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfe4ff, 0x8a7fb0, 0.55));
const sun = new THREE.DirectionalLight(0xfff0dc, 0.7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 40 }); sun.shadow.bias = -0.002;
scene.add(sun, sun.target);

// ───────── 재질 ─────────
const ramp = new THREE.DataTexture(new Uint8Array([110, 110, 110, 172, 172, 172, 228, 228, 228]), 3, 1, THREE.RGBFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.generateMipmaps = false; ramp.needsUpdate = true;
const mats = new Map();
const toon = (c) => { if (!mats.has(c)) mats.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: ramp })); return mats.get(c); };
const glowM = (c) => { const k = "g" + c; if (!mats.has(k)) mats.set(k, new THREE.MeshBasicMaterial({ color: c })); return mats.get(k); };
function M(geo, mat, x = 0, y = 0, z = 0, p) { const m = new THREE.Mesh(geo, typeof mat === "number" ? toon(mat) : mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; (p || scene).add(m); return m; }
const geos = new Map();
function rboxGeo(w, h, d, r = 0.05) {
  r = Math.min(r, w / 2 - 0.002, h / 2 - 0.002, d / 2 - 0.002); const k = [w, h, d, r].join(); if (geos.has(k)) return geos.get(k);
  const e = r * 0.05, x = w / 2 - r - e, y = h / 2 - r - e, s = new THREE.Shape();
  s.absarc(x, y, e, 0, Math.PI / 2); s.absarc(-x, y, e, Math.PI / 2, Math.PI); s.absarc(-x, -y, e, Math.PI, Math.PI * 1.5); s.absarc(x, -y, e, Math.PI * 1.5, Math.PI * 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 2, curveSegments: 2 }); g.translate(0, 0, -(d - 2 * r) / 2);
  geos.set(k, g); return g;
}
const box = (w, h, d, c, x, y, z, p, r) => M(rboxGeo(w, h, d, r), c, x, y, z, p);
const SPH = new THREE.SphereGeometry(1, 16, 12);

    for (const [kind, n] of [["seat", "seats"], ["truck", "trucks"]]) for (const o of layer(n).objects) { const r = rectOf(o); if (p.x >= r.l && p.x < r.l + r.w && p.z >= r.t && p.z < r.t + r.h) return { kind, o }; }
    for (const [kind, n] of [["spawn", "spawns"], ["animal", "animals"], ["landmark", "landmarks"]]) for (const o of layer(n).objects) if (Math.hypot(o.x / 32 - p.x, o.y / 32 - p.z) < 1) return { kind, o };
    return null; }
  const KIND_NAME = { seat: "벤치", truck: "트럭", spawn: "시작 위치", animal: "고양이 집", landmark: "랜드마크" };
  const selName = (sel) => `${KIND_NAME[sel.kind]} ${sel.kind === "truck" ? TRUCK_DEF.get(sel.o.name)?.name.ko || sel.o.name : prop(sel.o, "label") || sel.o.name}`;
  function showSel(dx = 0, dz = 0) { const sel = EDIT.sel; $("eTurn").disabled = sel?.kind !== "seat"; if (!sel) { selBox.visible = false; return; }
    const isRect = sel.kind === "seat" || sel.kind === "truck", r = isRect ? rectOf(sel.o) : { l: Math.floor(sel.o.x / 32), t: Math.floor(sel.o.y / 32), w: 1, h: 1 };
    const cx = r.l + dx + r.w / 2, cz = r.t + dz + r.h / 2; selBox.scale.set(r.w, 1, r.h); selBox.position.set(cx, heightAt(cx, cz) + 0.08, cz); selBox.visible = true; }
  function moveSel(dx, dz) { const sel = EDIT.sel; if (!dx && !dz) return; mark(); const o = sel.o;
    if (sel.kind === "seat" || sel.kind === "truck") { const id = blockId(sel), r = rectOf(o); dx = Math.max(1 - r.l, Math.min(MW - 1 - r.l - r.w, dx)); dz = Math.max(1 - r.t, Math.min(MH - 1 - r.t - r.h, dz));
      fillRect(o, id, id, 0); o.x += dx * 32; o.y += dz * 32; const clash = fillRect(o, id, 0, id); if (clash) toast(`${selName(sel)}이(가) 다른 장애물 ${clash}칸과 겹쳐요`, 2600); }
    else { o.x += dx * 32; o.y += dz * 32; if (sel.kind === "landmark") for (const k of ["accessX", "accessY"]) { const q = o.properties.find((p) => p.name === k); if (q) q.value += (k === "accessX" ? dx : dz) * 32; } }
    rebuildAll(); }
  function turnBench() { const sel = EDIT.sel; if (sel?.kind !== "seat") return; mark(); const o = sel.o, f0 = seatFacing(o), f1 = BENCH_TURN[f0];
    fillRect(o, BENCH_TILE[f0], BENCH_TILE[f0], 0);
    if ((f0 === "left") !== (f1 === "left")) { const w = o.width; o.width = o.height; o.height = w; }
    o.properties.find((p) => p.name === "facing").value = f1;
    const clash = fillRect(o, BENCH_TILE[f1], 0, BENCH_TILE[f1]); if (clash) toast(`벤치가 다른 장애물 ${clash}칸과 겹쳐요`, 2600); rebuildAll(); }

  // 저장·점검
  async function send(path) { const r = await fetch("/__mapedit/" + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(MAP) }); return [r.ok, await r.json()]; }
  async function save() { $("eSave").disabled = true;
    try { const [ok, j] = await send("save"); if (!ok) return showResult("저장하지 못했어요", j.errors || [j.error]);
      setDirty(false); showResult(j.problems.length ? `저장했어요 · 점검 문제 ${j.problems.length}개` : "저장했어요 · 점검 통과", j.problems, `assets/maps/park.json · 이전 파일 ${j.backup}. 게임 서버는 다시 띄워야 바뀐 길을 알아요`);
    } catch (e) { showResult("저장하지 못했어요", [String(e)]); } finally { $("eSave").disabled = false; } }
  async function check() { try { const [, j] = await send("check"); showResult(j.errors?.length ? "지도 형식이 잘못됐어요" : j.problems.length ? `점검 문제 ${j.problems.length}개` : "점검 통과", [...(j.errors || []), ...j.problems], "저장하지 않았어요"); } catch (e) { showResult("점검하지 못했어요", [String(e)]); } }

  // 도구 막대 동작
  const setTool = (t) => { EDIT.tool = t; bar.querySelectorAll("[data-tool]").forEach((b) => b.classList.toggle("on", b.dataset.tool === t)); if (t !== "move") { EDIT.sel = null; showSel(); } };
  bar.querySelectorAll("[data-tool]").forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
  $("eBrush").onclick = () => { EDIT.brush = EDIT.brush === 1 ? 3 : 1; $("eBrush").textContent = `붓 ${EDIT.brush}칸`; hover.scale.set(EDIT.brush, 1, EDIT.brush); };
  $("eGrid").onclick = () => { EDIT.grid = !EDIT.grid; $("eGrid").classList.toggle("on", EDIT.grid); gridMesh.visible = EDIT.grid; };
  $("eTurn").onclick = turnBench; $("eUndo").onclick = undo; $("eRedo").onclick = redo; $("eSave").onclick = save; $("eCheck").onclick = check;
  EDIT.key = (k, e) => {
    if ((e.ctrlKey || e.metaKey) && k === "s") { e.preventDefault(); save(); return true; }
    if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return true; }
    if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); return true; }
    if (/^[1-6]$/.test(k)) { setTool(TOOLS[+k - 1][0]); return true; }
    if (k === "b") { $("eBrush").click(); return true; } if (k === "g") { $("eGrid").click(); return true; } if (k === "r") { turnBench(); return true; }
    if (k === "escape") { EDIT.sel = null; showSel(); result.classList.add("hidden"); return false; }
    return ["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k); };

  // 마우스: 왼쪽 = 도구, 오른쪽·가운데로 끌기 = 화면 옮기기, 휠 = 확대 (원래 휠 처리 그대로)
  const tileAt = (e) => { setRay(e.clientX, e.clientY); const g = groundPoint(); return g && { x: Math.floor(g.x), z: Math.floor(g.z), fx: g.x, fz: g.z }; };
  let drag = null;
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => { e.stopImmediatePropagation(); canvas.setPointerCapture(e.pointerId); result.classList.add("hidden");
    const p = tileAt(e); if (!p) return;
    if (e.button === 1 || e.button === 2) { drag = { pan: true, at: new THREE.Vector3(p.fx, 0, p.fz) }; return; }
    if (EDIT.tool === "move") { EDIT.sel = pick(p); showSel(); drag = EDIT.sel && { move: true, from: p, dx: 0, dz: 0 }; if (EDIT.sel) info.textContent = selName(EDIT.sel); return; }
    const was = EDIT.dirty; mark(); drag = { paint: true, last: p, was }; paint(p.x, p.z); }, true);
  canvas.addEventListener("pointermove", (e) => { e.stopImmediatePropagation(); const p = tileAt(e); if (!p) { hover.visible = false; return; }
    if (drag?.pan) { EDIT.focus.x += drag.at.x - p.fx; EDIT.focus.z += drag.at.z - p.fz; return; }
    hover.visible = EDIT.tool !== "move"; hover.position.set(p.x + 0.5, heightAt(p.x + 0.5, p.z + 0.5) + 0.06, p.z + 0.5);
    const o = OBST[p.z * MW + p.x], under = pick(p);
    info.textContent = `칸 (${p.x}, ${p.z}) · ${TILE_NAME[o] ?? "장애물 " + o}${under ? " · " + selName(under) : ""}${EDIT.dirty ? "\n저장 안 됨" : ""}`;
    if (drag?.paint) { paintLine(drag.last, p); drag.last = p; }
    if (drag?.move) { drag.dx = p.x - drag.from.x; drag.dz = p.z - drag.from.z; showSel(drag.dx, drag.dz); } }, true);
  const end = (e) => { e.stopImmediatePropagation(); if (drag?.move) moveSel(drag.dx, drag.dz); if (drag?.paint && !drag.changed) { EDIT.undo.pop(); setDirty(drag.was); } drag = null; }; // 아무것도 안 바뀐 획은 되돌리기에 남기지 않는다
  canvas.addEventListener("pointerup", end, true); canvas.addEventListener("pointercancel", end, true);

  // 매 프레임: 방향키로 화면 옮기기, 칠하는 동안 장애물은 0.15초마다 다시 만든다
  EDIT.update = (dt) => {
    const f = (keys.has("w") || keys.has("arrowup") ? 1 : 0) - (keys.has("s") || keys.has("arrowdown") ? 1 : 0), rg = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0), v = 16 * dt;
    if (f || rg) { EDIT.focus.x += (-TOWARD_CAM.x * f + SCREEN_RIGHT.x * rg) * v; EDIT.focus.z += (-TOWARD_CAM.y * f + SCREEN_RIGHT.y * rg) * v; }
    EDIT.focus.x = Math.max(0, Math.min(MW, EDIT.focus.x)); EDIT.focus.z = Math.max(0, Math.min(MH, EDIT.focus.z)); EDIT.focus.y = heightAt(EDIT.focus.x, EDIT.focus.z) + 0.4;
    const now = performance.now(); if (EDIT.needBuild && (!drag?.paint || now - EDIT.lastBuild > 150)) { buildObstacles(); drawMapBase(); drawGrid(); EDIT.needBuild = false; EDIT.lastBuild = now; } };

  setTool("tree"); $("eGrid").classList.add("on"); drawGrid(); drawMarkers(); setDirty(false);
}
loadImages().then(() => { requestAnimationFrame(frame);
  // 첫 그림이 나온 뒤 불러오는 화면을 걷는다. 처음 온 사람에게는 조작 안내를 한 번
  requestAnimationFrame(() => { $("boot").classList.add("done"); setTimeout(() => $("boot").remove(), 500);
    if (EDIT.on) return toast("지도 편집 모드 · 왼쪽 도구로 칠하고, 오른쪽 버튼으로 끌어 화면을 옮겨요", 4000);
    let seen = false; try { seen = !!localStorage.getItem("parkPixel3dHelp"); } catch {} if (!seen) openHelp(); else toast("바닥을 누르면 걸어요 · 🗺 지도에서 가게를 골라요", 3200); }); });
window.__park = { state, walkTo, trucks, cat, goToTruck, openMap, nearestTruck, SEATS, goSit, standUp, sendEmote, petCat, goPetCat, trust: () => catTrust, simulate: (t) => { for (let k = 0; k < t / 0.05; k++) { updateEmote(0.05); updatePlayer(0.05); updateCooking(0.05); updateEating(0.05); updateCat(0.05); } } }; // 시험용
})();
</script>
