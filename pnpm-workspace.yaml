packages:
  - apps/*
  - packages/*

# 설치 스크립트 실행 허용(true)·거부(false). msgpackr-extract 는 선택적 네이티브 가속이라 거부 (순수 JS로 동작)
# better-sqlite3·argon2 는 네이티브 모듈. 미리 빌드된 바이너리를 받거나(arm64·x64), 없으면 직접 빌드한다 (build-essential, python3 필요)
allowBuilds:
  argon2: true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: false
