<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 아틀리에 · 3D 시제품</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4ebe7;color:#574741;font:15px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}main{height:100dvh;min-height:650px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#fffaf4,#e8d9d8)}header{position:absolute;top:36px;left:42px;pointer-events:none}small{letter-spacing:3px;font-size:11px;color:#94756b}h1{font-size:28px;letter-spacing:-1px;margin:12px 0}header p{color:#9b8278;line-height:1.7;font-size:13px}.tag{position:absolute;right:36px;top:38px;border:1px solid #d4c1b8;border-radius:30px;padding:10px 16px;font-size:12px}.panel{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:#fffbf4e8;backdrop-filter:blur(16px);border:1px solid white;box-shadow:0 10px 40px #765a4512;border-radius:24px;padding:18px 24px;min-width:440px;text-align:center}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{border:1px solid #e6d8ce;border-radius:12px;background:transparent;padding:10px 16px;color:#796155;cursor:pointer;font:inherit;font-size:13px}button[aria-pressed=true]{background:#6c9386;color:white;border-color:#6c9386}label{font-size:12px;display:inline-flex;gap:6px;align-items:center;margin:14px 9px 0}.hint{position:absolute;left:38px;bottom:40px;font-size:12px;line-height:1.9;color:#9b8278}.name{position:absolute;right:38px;bottom:42px;text-align:right;font-size:12px;color:#9b8278}.name b{display:block;font-size:20px;color:#796155;margin-bottom:7px}@media(max-width:700px){header{left:22px;top:22px}h1{font-size:22px}.tag{right:18px;top:24px;font-size:10px}.panel{min-width:0;width:calc(100% - 28px);bottom:18px;padding:14px 8px}.hint,.name,header p{display:none}}</style>
<main><canvas aria-label="회전하고 움직이는 민트 패딩 3D 캐릭터"></canvas><header><small>ONE PARK / CHARACTER ATELIER</small><h1>작고 포근한, 민트</h1><p>동그란 볼과 반짝이는 보랏빛 눈.<br>사진 속 작은 친구를 입체로 만나보세요.</p></header><div class="tag">적용 전 · 독립 시제품</div><div class="hint">드래그하여 360° 회전<br>휠 또는 두 손가락으로 확대</div><div class="name"><b>Mint Ribbon</b>01 / 겨울 산책</div><section class="panel"><div class="row"><button data-motion="idle" aria-pressed="true">살랑살랑</button><button data-motion="walk" aria-pressed="false">걷기</button><button data-motion="wave" aria-pressed="false">손 흔들기</button><button data-motion="jump" aria-pressed="false">깡총!</button></div><label><input id="rotate" type="checkbox">자동 회전</label><label><input id="pause" type="checkbox">동작 멈춤</label><button id="reset">정면 보기</button></section></main><script src="../three.min.js"></script><script src="./model.js"></script><script src="./studio.js"></script></html>
